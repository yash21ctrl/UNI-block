version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: railblock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-railblock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-railblock_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-railblock_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-railblock} -d ${POSTGRES_DB:-railblock_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: railblock-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: railblock-backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-railblock}:${POSTGRES_PASSWORD:-railblock_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-railblock_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-super_secret_railblock_jwt_key_development_only_change_in_production}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:
